  <radialGradient id="petal"><stop offset="0" stop-color="#fff8f5"/><stop offset=".55" stop-color="#efc2cb"/><stop offset="1" stop-color="#d990a0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
